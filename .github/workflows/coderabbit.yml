name: Secret Scanning

# Code review is handled by the CodeRabbit GitHub App (reads .coderabbit.yaml).
# This workflow only runs TruffleHog secret scanning on pull requests.
# It deliberately does NOT trigger on push: direct pushes to main are covered
# by local gitleaks/secret-guard hooks, and a push-to-main TruffleHog run hits
# the "BASE and HEAD are the same" failure. PR runs have a real diff to scan.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
